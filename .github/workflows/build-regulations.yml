name: Rebuild regulatory bundles from their sources

# Rules are generated, never hand-written: a committed bundle must be exactly
# what its builder produces from the authority's current source. A development
# container that cannot reach the authorities cannot run the builders, so this
# runs the requested ones on a runner and commits what they produced.
#
# Asked for by committing `.regulatory/request.json` on a working branch:
#
#   { "builders": ["alberta", "manitoba"] }
#
# A builder that refuses (a changed source it must not use unreviewed) fails
# this run, and its refusal is the log. Never runs on main.
on:
  push:
    branches-ignore: [main]
    paths:
      - .regulatory/request.json

permissions:
  contents: write

concurrency:
  group: build-regulations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Run the requested builders
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the pinned PDF text extractor
        run: python3 -m pip install --user pypdf==6.19.0
      - name: Run the builders
        run: |
          node -e '
            const r = require("./.regulatory/request.json");
            const known = {
              alberta: "node scripts/build-alberta-regulations.mjs",
              manitoba: "node scripts/build-manitoba-regulations.mjs",
              "manitoba-check": "node scripts/build-manitoba-regulations.mjs --check",
              "overlay-index": "node scripts/build-overlay-zone-index.mjs",
            };
            for (const b of r.builders) if (!known[b]) throw new Error(`unknown builder ${b}`);
            require("fs").writeFileSync(".regulatory/commands.txt", r.builders.map((b) => known[b]).join("\n") + "\n");
          '
          set -o pipefail
          : > .regulatory/build.log
          status=0
          while read -r command; do
            [ -z "$command" ] && continue
            echo "== $command" | tee -a .regulatory/build.log
            $command 2>&1 | tee -a .regulatory/build.log || status=1
          done < .regulatory/commands.txt
          echo "exit=$status" >> .regulatory/build.log
      - name: Commit what the builders produced
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/regulatory .regulatory/build.log
          git commit -m "chore(regulatory): rebuild bundles from their sources" \
            -m "Generated by .github/workflows/build-regulations.yml from ${GITHUB_SHA}." || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
