name: Certify Hunt in a real browser

# Runs the browser certifications against a deployed Hunt — the real Google map,
# the provinces' live zone geometry, the live geocoder — from a runner that can
# reach all of them, which a development container often cannot.
#
# Asked for by committing `.certification/request.json` on a working branch:
#
#   { "base": "https://www.northgroundbushcraft.com", "production": true,
#     "commit": "<the deployed sha>", "huntApp": true }
#
# It commits back what it saw: the check output, JPEG screenshots a person
# reads, and — for a production run — the verification record keyed by the
# artifact hashes that painted. Screenshots are for review on the branch and do
# not belong on main. Never runs on main; a commit made here does not start
# another run.
on:
  push:
    branches-ignore: [main]
    paths:
      - .certification/request.json

permissions:
  contents: write

concurrency:
  group: certify-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Certify the deployed Hunt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Read the request
        id: request
        run: |
          node -e '
            const r = require("./.certification/request.json");
            if (!/^https:\/\/[a-z0-9.-]+(\/|$)/.test(r.base)) throw new Error("base must be an https URL");
            const out = [`base=${r.base}`, `production=${r.production ? "true" : "false"}`, `commit=${r.commit ?? ""}`, `huntapp=${r.huntApp ? "true" : "false"}`];
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
          '
      - name: Species surface certification
        env:
          BASE: ${{ steps.request.outputs.base }}
          PRODUCTION: ${{ steps.request.outputs.production }}
          COMMIT: ${{ steps.request.outputs.commit }}
        run: |
          rm -rf .certification/shots
          EXTRA=""
          if [ "$PRODUCTION" = "true" ]; then EXTRA="--production --commit $COMMIT"; fi
          set +e
          node scripts/certify-species-surface.mjs --base "$BASE" --viewports 390x844,1280x800 \
            --all-species --shots .certification/shots --record content/intelligence/surface-verification.json $EXTRA \
            > .certification/species-surface.txt 2>&1
          echo "exit=$?" >> .certification/species-surface.txt
          cat .certification/species-surface.txt
      - name: Hunt app certification
        if: steps.request.outputs.huntapp == 'true'
        env:
          BASE: ${{ steps.request.outputs.base }}
        run: |
          set +e
          node scripts/certify-hunt-app.mjs "$BASE" > .certification/hunt-app.txt 2>&1
          echo "exit=$?" >> .certification/hunt-app.txt
          tail -40 .certification/hunt-app.txt
      - name: Commit what the browser saw
        run: |
          node scripts/report-species-coverage.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .certification content/intelligence/surface-verification.json docs/species-spatial-coverage.md
          git commit -m "chore(certification): browser certification of ${{ steps.request.outputs.base }}" \
            -m "Generated by .github/workflows/certify-browser.yml from ${GITHUB_SHA}." || exit 0
          # Another runner (a surface rebuild, a research read) may have
          # committed to the branch meanwhile; their paths never overlap.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
