name: Build species surfaces

# Regenerates the Breeding Bird Survey surfaces FROM THE SURVEY, on a runner
# that can reach ScienceBase, and commits them to the branch that changed the
# builder.
#
# Why this exists: the surfaces are generated artifacts, reproduced byte for
# byte by the daily source watch (`--check --fetch`), so they may only ever be
# written by the builder reading the release. A development environment that
# cannot reach the release host must not approximate them — an artifact derived
# from the previous artifact instead of from the survey would pass every local
# test and fail the next morning's watch. This makes the honest path the easy
# one: change the builder on a branch, push, and the runner rebuilds.
#
# Never on main. Main receives these artifacts only through a reviewed merge,
# and a commit made here by the workflow's token does not start another run.
on:
  push:
    branches-ignore: [main]
    paths:
      - scripts/build-bbs-surface.mjs
      - src/lib/hunt/intelligence/surface-raster.ts
      - src/lib/hunt/intelligence/species-catalogue.ts
      - .github/workflows/build-surfaces.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-surfaces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rebuild the surfaces from the survey release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build every surface from the pinned release
        run: node scripts/build-bbs-surface.mjs
      - name: Prove the build reproduces
        run: node scripts/build-bbs-surface.mjs --check
      # A rebuilt artifact has a new hash, so the coverage matrix's stages move
      # with it (a browser verification counts only for the bytes it saw).
      - name: Regenerate the coverage matrix
        run: node scripts/report-species-coverage.mjs
      - name: Commit the regenerated surfaces
        run: |
          if git diff --quiet -- content/intelligence docs/species-spatial-coverage.md; then
            echo "Surfaces unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/intelligence/surfaces content/intelligence/surface-registry.json docs/species-spatial-coverage.md
          git commit -m "chore(intelligence): rebuild species surfaces from the survey release" \
            -m "Generated by .github/workflows/build-surfaces.yml from ${GITHUB_SHA}."
          git push origin "HEAD:${GITHUB_REF_NAME}"
