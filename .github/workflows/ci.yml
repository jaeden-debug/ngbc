name: CI

# Every push and every pull request onto main. These are the gates that were
# being run by hand until 2026-09-21, which is how a date defect that only
# appears under a UTC server reached production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No secrets are needed and none are granted, which is verified rather than
# assumed: the full suite runs with no environment file present. The build
# renders from committed content and every test uses deterministic fixtures.
#
# That was not true when this file was first written — importing the publisher
# read Supabase credentials at module scope, so a pure test of which rule
# dimensions the schema can represent demanded a production service-role key and
# therefore could not run here at all. Credentials are resolved on first use
# now. A gate that needs a production secret is a gate that does not run on a
# fork's pull request, which is where it is worth the most.
#
# The one job that talks to government sources is scheduled separately.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    # CI runs in UTC, which is the point: a developer's machine shares its time
    # zone with its browser and hides a whole class of defect.
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Content contract
        run: npm run validate:content:published

  timezones:
    name: Date behaviour across time zones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A hunt date is a calendar day. The suites below are the ones that read a
      # clock, and they must give the same answers whatever zone the process
      # runs in — the server runs in UTC and the hunter does not.
      - name: Date, season and weather behaviour under five time zones
        run: npm run test:timezones

  regulatory-bundles-are-generated:
    name: Regulatory bundles match their builders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Rules are generated, never hand-written. A bundle edited by hand would
      # pass every test and be wrong against its own source, so the committed
      # file must be exactly what the builder produces. This does fetch the
      # official pages; if they are unreachable the step is skipped rather than
      # failed, because an outage at the province is not a defect here.
      - name: Rebuild from source and diff
        run: |
          if ! npm run build:regulations; then
            echo "::warning::Could not reach the official sources; skipping the generated-bundle check."
            exit 0
          fi
          if ! git diff --exit-code --stat content/regulatory/; then
            echo "::error::A committed regulatory bundle is not what its builder produces."
            echo "Either the source moved and the bundle was not rebuilt, or a bundle was edited by hand."
            git diff content/regulatory/ | head -200
            exit 1
          fi
          echo "Committed bundles match their builders exactly."
