name: Read a research source from a runner

# Some authorities publish evidence only as documents on portals a development
# container cannot reach. This reads them from a runner that can, and commits
# the extracted text back to the working branch for the builder to interpret.
#
# Asked for by committing `.research/request.json` on a working branch:
#
#   { "sources": ["alberta-ungulate-surveys", "manitoba-guide"] }
#
# (A single "source" is accepted too.) Each source is read in turn; one that
# fails is logged and the rest still run.
#
# What it commits is working material for that branch (catalogue metadata,
# licences as stated, sha256 of every document and its extracted text). Only
# derived facts, each citing its document, belong on main. Never runs on main.
on:
  push:
    branches-ignore: [main]
    paths:
      - .research/request.json

permissions:
  contents: write

concurrency:
  group: fetch-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    name: Read the requested source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same pinned extractor the regulatory builders use, so a re-read of
      # an unchanged document is byte-identical.
      - name: Install the pinned PDF text extractor
        run: python3 -m pip install --user pypdf==6.19.0
      - name: Read the requested sources
        run: |
          node -e '
            const r = require("./.research/request.json");
            const known = {
              "alberta-ungulate-surveys": "scripts/fetch-alberta-ungulate-surveys.mjs --out .research/alberta-ungulate",
              "manitoba-guide": "scripts/fetch-manitoba-guide.mjs --out .research/manitoba-guide",
              "probe": "scripts/probe-research-sources.mjs --out .research/probe",
            };
            const sources = r.sources ?? [r.source];
            for (const source of sources) if (!known[source]) throw new Error(`unknown source ${source}`);
            require("fs").writeFileSync(".research/commands.txt", sources.map((s) => known[s]).join("\n") + "\n");
          '
          : > .research/fetch.log
          while read -r command; do
            [ -z "$command" ] && continue
            echo "== node $command" | tee -a .research/fetch.log
            node $command 2>&1 | tee -a .research/fetch.log || echo "FAILED: $command" | tee -a .research/fetch.log
          done < .research/commands.txt
      - name: Commit what was read
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .research
          git commit -m "chore(research): read ${{ github.sha }} request from a runner" \
            -m "Generated by .github/workflows/fetch-research.yml. Working material for this branch; not for main." || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
