name: Read a research source from a runner

# Some authorities publish evidence only as documents on portals a development
# container cannot reach. This reads them from a runner that can, and commits
# the extracted text back to the working branch for the builder to interpret.
#
# Asked for by committing `.research/request.json` on a working branch:
#
#   { "sources": ["alberta-ungulate-surveys", "manitoba-guide"] }
#
# (A single "source" is accepted too.) Each source is read in turn; one that
# fails is logged and the rest still run.
#
# What it commits is working material for that branch (catalogue metadata,
# licences as stated, sha256 of every document and its extracted text). Only
# derived facts, each citing its document, belong on main. Never runs on main.
on:
  push:
    branches-ignore: [main]
    paths:
      - .research/request.json

permissions:
  contents: write

concurrency:
  group: fetch-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    name: Read the requested source
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same pinned extractor the regulatory builders use, so a re-read of
      # an unchanged document is byte-identical.
      - name: Install the pinned PDF text extractor, raster and vector readers
        run: python3 -m pip install --user pypdf==6.19.0 rasterio==1.4.3 numpy==2.2.6 fiona==1.10.1
      - name: Read the requested sources
        run: |
          node -e '
            const r = require("./.research/request.json");
            const known = {
              "alberta-ungulate-surveys": "scripts/fetch-alberta-ungulate-surveys.mjs --out .research/alberta-ungulate",
              "manitoba-guide": "scripts/fetch-manitoba-guide.mjs --out .research/manitoba-guide",
              "probe": "scripts/probe-research-sources.mjs --out .research/probe",
              /* Named authority pages and documents, and occurrence facets, as
                 served: hashed and extracted, never interpreted here. */
              "pages": "scripts/fetch-research-pages.mjs --out .research/pages",
              /* A public page that lists its files only to a browser running
                 its own script: rendered as a browser renders it, never past
                 a login, consent wall or CAPTCHA. */
              "rendered": "RENDERED",
              "unit-boundaries": "scripts/fetch-unit-boundaries.mjs --out .research/units",
              "bbs-routes": "scripts/build-bbs-surface.mjs --routes-out=.research/bbs-routes",
              "gbif-presence": "scripts/fetch-gbif-presence.mjs --out .research/gbif",
              "landcover": "LANDCOVER",
              "terrain": "TERRAIN",
              /* Which state or province each grid cell lies in (Census and
                 Statistics Canada cartographic boundaries), for keeping records
                 inside the geography a range statement names. */
              "jurisdictions": "JURISDICTIONS",
              /* The HUC12 sub-watershed at each grid cell's centre (USGS WBD),
                 so GAP range tables can be read sub-watershed by sub-watershed.
                 The national geodatabase is cached outside the repository. */
              "huc12": "HUC12",
              /* Authority range maps (USGS GAP CONUS 2001, ECCC Species at Risk
                 range extents) for the heat species in .research/authority-targets.json. */
              "authority-ranges": "AUTHORITY_RANGES",
              /* Migratory species hunted in autumn and winter: their records from
                 September to February, so the range drawn is where they are in the
                 season, not where they breed. */
              "gbif-season": "scripts/fetch-gbif-presence.mjs --out .research/gbif-season --months=9-12,1-2 --species=" + (r.season ?? ["species:brant", "species:cackling-goose", "species:greater-white-fronted-goose", "species:rosss-goose", "species:snow-goose", "species:black-scoter", "species:common-eider", "species:harlequin-duck", "species:king-eider", "species:long-tailed-duck", "species:surf-scoter", "species:white-winged-scoter", "species:tundra-swan", "species:king-rail", "species:purple-gallinule"]).join(","),
              "gbif-retry": "scripts/fetch-gbif-presence.mjs --out .research/gbif --species=" + (r.retry ?? []).join(","),
              /* The strip east of 180 (the Rat and Near Islands, to Attu), for
                 every profiled species, as its own read beside the main one:
                 all-year records for species drawn from them, hunting-season
                 records for those drawn in the season. Lists come from the
                 profiles, so no species is left out by a list kept here. */
              "gbif-east": "scripts/fetch-gbif-presence.mjs --strip=antimeridian --out .research/gbif-east --species=" + Object.entries(require("./content/intelligence/surface-profiles.json").species).filter(([, p]) => p.season !== "HUNTING_SEASON_RECORDS").map(([id]) => id).join(","),
              "gbif-season-east": "scripts/fetch-gbif-presence.mjs --strip=antimeridian --out .research/gbif-season-east --months=9-12,1-2 --species=" + Object.entries(require("./content/intelligence/surface-profiles.json").species).filter(([, p]) => p.season === "HUNTING_SEASON_RECORDS").map(([id]) => id).join(","),
            };
            const sources = r.sources ?? [r.source];
            for (const source of sources) if (!known[source]) throw new Error(`unknown source ${source}`);
            require("fs").writeFileSync(".research/commands.txt", sources.map((s) => known[s]).join("\n") + "\n");
          '
          : > .research/fetch.log
          while read -r command; do
            [ -z "$command" ] && continue
            if [ "$command" = "TERRAIN" ]; then
              echo "== terrain foundation" | tee -a .research/fetch.log
              python3 scripts/build-terrain-foundation.py --out content/intelligence/foundation 2>&1 | tail -30 | tee -a .research/fetch.log || echo "FAILED: terrain" | tee -a .research/fetch.log
              continue
            fi
            if [ "$command" = "RENDERED" ]; then
              echo "== rendered listings" | tee -a .research/fetch.log
              npx playwright install --with-deps chromium > /dev/null 2>&1
              node scripts/read-rendered-listing.mjs --out .research/rendered 2>&1 | tail -40 | tee -a .research/fetch.log || echo "FAILED: rendered" | tee -a .research/fetch.log
              continue
            fi
            if [ "$command" = "HUC12" ]; then
              echo "== HUC12 foundation" | tee -a .research/fetch.log
              python3 scripts/build-huc12-foundation.py --out content/intelligence/foundation --cache "$RUNNER_TEMP/wbd" 2>&1 | tail -30 | tee -a .research/fetch.log || echo "FAILED: huc12" | tee -a .research/fetch.log
              continue
            fi
            if [ "$command" = "JURISDICTIONS" ]; then
              echo "== jurisdiction foundation" | tee -a .research/fetch.log
              python3 scripts/build-jurisdiction-foundation.py --out content/intelligence/foundation --cache "$RUNNER_TEMP/jurisdictions" 2>&1 | tail -30 | tee -a .research/fetch.log || echo "FAILED: jurisdictions" | tee -a .research/fetch.log
              continue
            fi
            if [ "$command" = "AUTHORITY_RANGES" ]; then
              echo "== authority range maps" | tee -a .research/fetch.log
              python3 scripts/fetch-authority-ranges.py --targets .research/authority-targets.json --out .research/authority-ranges 2>&1 | tail -400 | tee -a .research/fetch.log || echo "FAILED: authority ranges" | tee -a .research/fetch.log
              continue
            fi
            if [ "$command" = "LANDCOVER" ]; then
              echo "== land-cover foundation" | tee -a .research/fetch.log
              python3 scripts/build-landcover-foundation.py \
                --url "https://zenodo.org/api/records/3939050/files/PROBAV_LC100_global_v3.0.1_2019-nrt_Discrete-Classification-map_EPSG-4326.tif/content" \
                --doi 10.5281/zenodo.3939050 --out content/intelligence/foundation 2>&1 | tail -30 | tee -a .research/fetch.log || echo "FAILED: land cover" | tee -a .research/fetch.log
              continue
            fi
            echo "== node $command" | tee -a .research/fetch.log
            node $command 2>&1 | tee -a .research/fetch.log || echo "FAILED: $command" | tee -a .research/fetch.log
          done < .research/commands.txt
      - name: Commit what was read
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .research
          [ -d content/intelligence/foundation ] && git add content/intelligence/foundation
          git commit -m "chore(research): read ${{ github.sha }} request from a runner" \
            -m "Generated by .github/workflows/fetch-research.yml. Working material for this branch; not for main." || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
