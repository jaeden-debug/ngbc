name: Official source watch

# Regulations and intelligence datasets change without notifying consumers.
# This reads every source North Ground publishes from and reports when one moves,
# so a change reaches a reviewer instead of silently altering production.
#
# It never publishes anything. A changed source opens an issue; promoting the
# change is a human decision made against the diff.
on:
  schedule:
    # 11:00 UTC daily — morning in Ontario, so a change is on the desk before
    # the day's work rather than overnight.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-watch
  cancel-in-progress: false

jobs:
  check:
    name: Have the official sources moved?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # U.S. regulations are published as PDF booklets; the builders read them
      # through this exact pypdf, so a rebuild from an unchanged source is
      # byte-identical (scripts/pdf-text.py refuses any other version).
      - name: Install the pinned PDF text extractor
        run: python3 -m pip install --user pypdf==6.19.0
      - name: Compare live sources against the committed bundles
        id: check
        run: |
          set +e
          REGULATORY=$(npm run --silent check:regulatory-sources 2>&1)
          REGULATORY_STATUS=$?
          INTELLIGENCE=$(npm run --silent check:intelligence-sources 2>&1)
          INTELLIGENCE_STATUS=$?
          OUTPUT=$(printf 'REGULATORY\n%s\n\nMAP INTELLIGENCE\n%s\n' "$REGULATORY" "$INTELLIGENCE")
          echo "$OUTPUT"
          {
            echo "report<<SOURCE_REPORT_EOF"
            echo "$OUTPUT"
            echo "SOURCE_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
          # 0 unchanged, 2 a source moved, anything else is a failed read.
          if [ $REGULATORY_STATUS -eq 2 ] || [ $INTELLIGENCE_STATUS -eq 2 ]; then echo "state=moved" >> "$GITHUB_OUTPUT"
          elif [ $REGULATORY_STATUS -eq 0 ] && [ $INTELLIGENCE_STATUS -eq 0 ]; then echo "state=unchanged" >> "$GITHUB_OUTPUT"
          else echo "state=unreadable" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Open an issue when a source moves or cannot be read
        if: steps.check.outputs.state != 'unchanged'
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ steps.check.outputs.state }}';
            const report = process.env.REPORT || '';
            const label = 'regulatory-source';
            const title = state === 'moved'
              ? 'An official Hunt source has changed — review before publishing'
              : 'An official Hunt source could not be read';

            // One open issue at a time. A daily duplicate is how a real change
            // gets lost in a list of identical ones.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });
            const body = [
              state === 'moved'
                ? 'A source North Ground publishes from has changed since its bundle was built.'
                : 'The source check could not read an official page. This may be an outage rather than a change, but a source that stays unreadable is a source that has silently stopped being verified.',
              '',
              '**Nothing has been published.** For regulation sources, rebuild with `npm run build:regulations`,',
              'read the rule-level diff, and re-certify. For intelligence evidence, rebuild with',
              '`npm run build:intelligence`, inspect changed metrics/coverage/methodology, and review before promotion.',
              '',
              '<details><summary>Check output</summary>',
              '',
              '```',
              report.slice(0, 55000),
              '```',
              '',
              '</details>',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number,
                body: `Still ${state} as of this run.\n\n${body}`,
              });
              core.notice(`Commented on existing issue #${open.data[0].number}.`);
              return;
            }
            const created = await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: [label],
            });
            core.notice(`Opened issue #${created.data.number}.`);
        env:
          REPORT: ${{ steps.check.outputs.report }}

      - name: Fail the run so the change is visible in the Actions tab too
        if: steps.check.outputs.state == 'moved'
        run: exit 1
